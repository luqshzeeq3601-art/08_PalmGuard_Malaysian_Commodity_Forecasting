name: PalmGuard Scheduled Forecasting Pipeline

on:
  schedule:
    # Full pipeline: monthly on the 8th at 03:00 UTC (11:00 MYT) after Pink Sheet & exchange rates release
    - cron: '0 3 8 * *'
    # Ingest check: weekly on Mondays at 03:00 UTC
    - cron: '0 3 * * 1'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Execution mode: full or ingest-only'
        required: true
        default: 'full'
        type: choice
        options:
          - full
          - ingest-only

concurrency:
  group: palmguard-pipeline
  cancel-in-progress: false

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock.txt
          pip install -e .

      - name: PalmGuard Doctor
        run: palmguard doctor

      - name: Run Pipeline Step
        run: |
          if [ "${{ github.event.inputs.mode }}" = "ingest-only" ] || [ "${{ github.event.schedule }}" = "0 3 * * 1" ]; then
            echo "[*] Executing ingest-only mode..."
            palmguard ingest --mode incremental
          else
            echo "[*] Executing full pipeline..."
            palmguard pipeline run
          fi

      - name: Commit and push updated snapshots and published artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/raw/ data/processed/ reports/published/
          if git diff --staged --quiet; then
            echo "[*] No new snapshots or artifacts to commit."
          else
            git commit -m "chore(data): automated monthly pipeline refresh [skip ci]"
            git push
          fi
