name: PalmGuard Live Data Contracts

on:
  schedule:
    # Run weekly contract checks against live data.gov.my and World Bank sources on Wednesdays at 03:00 UTC
    - cron: '0 3 * * 3'
  workflow_dispatch:

concurrency:
  group: palmguard-live-contract
  cancel-in-progress: false

jobs:
  live-contract-check:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock.txt
          pip install -e ".[dev]"

      - name: Pull live sources and run data contracts (nothing is committed)
        run: |
          palmguard ingest --mode incremental
