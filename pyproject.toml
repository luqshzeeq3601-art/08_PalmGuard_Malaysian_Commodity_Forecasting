[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "palmguard"
version = "0.1.0"
description = "Monthly palm oil price forecasting with conformal intervals on open Malaysian and World Bank data"
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
    "duckdb>=0.10.0",
    "fastapi>=0.110.0",
    "httpx>=0.27.0",
    "lightgbm>=4.3.0",
    "matplotlib>=3.8.0",
    "mlflow>=2.11.0",
    "numpy>=1.26.0,<2.0.0",
    "openpyxl>=3.1.2",
    "pandas>=2.2.0",
    "pydantic>=2.6.0",
    "pyarrow>=15.0.0",
    "pyyaml>=6.0.1",
    "scikit-learn>=1.4.0",
    "scipy>=1.11.0",
    "statsmodels>=0.14.0",
    "streamlit>=1.32.0",
    "uvicorn>=0.28.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.3.0",
]

[project.scripts]
palmguard = "palmguard.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q -p no:cacheprovider"
markers = ["live: calls a real external source; excluded from CI"]
